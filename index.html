<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TripTalk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main>
    <h1>TripTalk</h1>
    <p class="tagline">Start planning a group trip.</p>

    <form id="create-trip-form">
      <label>
        Trip name
        <input type="text" name="name" required>
      </label>
      <label>
        House address
        <input type="text" name="address" required>
      </label>
      <label>
        City, State <span class="hint">(used only to look up weather)</span>
        <input type="text" name="cityState" required>
      </label>
      <label>
        House listing URL <span class="hint">(optional, shown as "House details")</span>
        <input type="url" name="houseUrl">
      </label>
      <div class="row">
        <label>
          Start date
          <input type="date" name="startDate" required>
        </label>
        <label>
          End date
          <input type="date" name="endDate" required>
        </label>
      </div>
      <label>
        Group password
        <div class="password-field">
          <input type="password" name="password" required minlength="4">
          <button type="button" class="toggle-password">Show</button>
        </div>
      </label>
      <button type="submit">Create trip</button>
    </form>

    <p id="status" class="status"></p>
  </main>

  <script type="module" src="js/index.js"></script>
</body>
</html>
